# Blueprint Render — https://render.com/docs/blueprint-spec
# Conecta el repo y Render crea el servicio web + variables base.

services:
  - type: web
    name: mantis-app
    runtime: python
    plan: starter
    # El piloto exige como mínimo Starter; migraciones permanecen en buildCommand.
    buildCommand: pip install -r requirements.txt && python scripts/migrate_deploy.py
    startCommand: gunicorn run:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: roustix-keyvalue
          property: connectionString
      - key: DISTRIBUTED_RATE_LIMITS_REQUIRED
        value: "true"
      - key: WORKER_HEARTBEAT_REQUIRED
        value: "true"
      - key: WORKER_HEARTBEAT_MAX_AGE_SECONDS
        value: "90"
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: METRICS_TOKEN
        sync: false
      - key: OPS_ALERT_COOLDOWN_SECONDS
        value: "300"
      - key: OPS_ALERT_EMAIL
        sync: false
      - key: DB_HEALTH_DEGRADED_MS
        value: "750"
      - key: REDIS_HEALTH_DEGRADED_MS
        value: "250"

  - type: worker
    name: roustix-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.worker
    autoDeploy: true
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: FLASK_CONFIG
        value: worker
      # Debe ser exactamente la misma SECRET_KEY del servicio web para abrir
      # los secretos HMAC ya sellados de los endpoints de webhook.
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: roustix-keyvalue
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: OPS_ALERT_EMAIL
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: WORKER_POLL_SECONDS
        value: "2"
      - key: WORKER_WEBHOOK_BATCH_SIZE
        value: "50"
      - key: WORKER_MAINTENANCE_ENABLED
        value: "true"
      - key: WORKER_MAINTENANCE_INTERVAL_SECONDS
        value: "3600"

  - type: keyvalue
    name: roustix-keyvalue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: volatile-lru
    persistenceMode: journal-snapshot
